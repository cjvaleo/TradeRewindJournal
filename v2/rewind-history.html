<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewind — History</title>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REWIND — HISTORY
   The tape. Every trade in reverse order, grouped by session,
   each day's subtotal reconciling to the calendar.

   Reads filters from the URL so Overview and Calendar can link
   straight in:  ?month=2026-07&model=OTE
                 ?date=2026-07-22&sort=pnl_desc
   ============================================================ */
:root{
  --black:#0E1114; --ink:#14171B; --panel:#181C20; --raise:#1E2227;
  --edge:rgba(255,255,255,.20); --rule:rgba(255,255,255,.15); --hair:rgba(255,255,255,.09);
  --white:#FFFFFF; --text:#FFFFFF;
  --up:#57BE8B; --up-2:#7FD9AC;
  --dn:#DE6B62; --dn-2:#F09189;
  --fig:"Azeret Mono",ui-monospace,monospace;
  --disp:"Instrument Sans",system-ui,sans-serif;
  --brand:"Syne",Helvetica,sans-serif;
  --ui:"Inter Tight",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--text);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums;}
.lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:#FFF;opacity:1;}

body::before{content:'';position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:radial-gradient(58% 42% at 50% -10%, rgba(255,255,255,.045), transparent 68%);}
.flute{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.3;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.045) 0px, rgba(255,255,255,.045) 1px,
    rgba(255,255,255,.012) 2px, rgba(0,0,0,.16) 7px, rgba(0,0,0,.16) 11px);}
.vign{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(100% 80% at 50% 40%, transparent 52%, rgba(6,8,10,.55) 100%);}
body::after{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");}

/* ---------------- TOP ---------------- */
.top{position:sticky;top:0;z-index:60;background:rgba(14,17,20,.92);backdrop-filter:blur(16px);box-shadow:inset 0 -1px 0 var(--hair);}
.top .in{max-width:1560px;margin:0 auto;height:60px;display:flex;align-items:center;gap:26px;padding:0 30px;}
.brand{font-family:var(--brand);font-weight:800;font-size:17px;letter-spacing:-.03em;text-transform:uppercase;position:relative;color:#FFF;}
.brand .gh{position:absolute;left:-10px;top:0;opacity:.22;filter:blur(3.5px);pointer-events:none;}
.brand em{font-family:var(--mono);font-style:normal;font-weight:400;font-size:8px;letter-spacing:.24em;color:#FFF;opacity:1;margin-left:10px;vertical-align:3px;}
.nav{display:flex;gap:2px;height:100%;}
.nl{display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#FFF;opacity:1;cursor:pointer;position:relative;transition:opacity .16s;text-decoration:none;}
.nl:hover,.nl.on{opacity:1;}
.nl.on::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:1px;background:#FFF;}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px;}
.tstamp{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:#FFF;opacity:1;text-transform:uppercase;}
.btn-w{background:#FFF;color:var(--black);font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  border:none;border-radius:2px;padding:11px 18px;cursor:pointer;transition:transform .15s;}
.btn-w:hover{transform:translateY(-1px);}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--hair);}

.wrap{max-width:1320px;margin:0 auto;padding:36px 30px 66px;}

/* ---------------- MASTHEAD ---------------- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:20px;}
.mtitle{position:relative;height:clamp(46px,5.4vw,72px);}
.mtitle span{position:absolute;left:0;top:0;font-family:var(--disp);font-weight:700;
  font-size:clamp(40px,4.9vw,68px);line-height:1;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap;color:#FFF;}
.mtitle .g3{transform:translateX(-34px);filter:blur(9px);opacity:.09;}
.mtitle .g2{transform:translateX(-19px);filter:blur(5px);opacity:.15;}
.mtitle .g1{transform:translateX(-8px); filter:blur(2.5px);opacity:.26;}
.mastr{text-align:right;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#FFF;opacity:1;line-height:1.9;}
.mastr b{color:#FFF;opacity:1;}

/* ---------------- CONTROL BAR ---------------- */
.controls{border:1px solid var(--edge);border-radius:4px;background:var(--ink);margin-bottom:14px;}
.crow{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap;}
.searchbox{display:flex;align-items:center;gap:9px;flex:1;min-width:200px;background:rgba(255,255,255,.045);
  border:1px solid var(--rule);border-radius:3px;padding:0 12px;}
.searchbox svg{width:13px;height:13px;opacity:.55;flex:none;}
.searchbox input{flex:1;background:none;border:none;outline:none;color:#FFF;font-family:var(--ui);font-size:13px;padding:10px 0;}
.searchbox input::placeholder{color:#FFF;opacity:1;}
.filterbtn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#FFF;background:rgba(255,255,255,.045);border:1px solid var(--rule);border-radius:3px;
  padding:10px 14px;cursor:pointer;transition:all .14s;}
.filterbtn:hover{background:rgba(255,255,255,.1);}
.filterbtn[aria-expanded="true"]{background:#FFF;color:var(--black);border-color:#FFF;}
.filterbtn .badge{font-family:var(--fig);font-size:9px;font-weight:600;letter-spacing:0;
  background:#FFF;color:var(--black);border-radius:99px;padding:2px 6px;display:none;}
.filterbtn[aria-expanded="true"] .badge{background:var(--black);color:#FFF;}
.filterbtn .badge.on{display:inline-block;}

.panel-drawer{display:none;grid-template-columns:auto repeat(4,minmax(120px,1fr));gap:18px;
  padding:16px;border-top:1px solid var(--rule);background:rgba(255,255,255,.02);}
.panel-drawer.open{display:grid;}
.dfield{display:flex;flex-direction:column;gap:8px;}
.dfield .lab{opacity:.62;}
.dfield select{width:100%;}

.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;}
.seg button{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#FFF;opacity:1;
  background:transparent;border:none;border-right:1px solid var(--rule);padding:9px 13px;cursor:pointer;transition:all .14s;}
.seg button:last-child{border-right:none;}
.seg button:hover{opacity:1;}
.seg button.on{background:#FFF;color:var(--black);opacity:1;}
select{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#FFF;
  background:rgba(255,255,255,.045);border:1px solid var(--rule);border-radius:3px;padding:9px 11px;cursor:pointer;outline:none;}
select option{background:var(--raise);color:#FFF;}

/* active filters read out of the URL */
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 14px;}
.chips .from{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#FFF;opacity:1;}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--black);background:#FFF;border:none;border-radius:99px;padding:6px 11px;cursor:pointer;}
.chip b{font-weight:600;}
.chip .x{opacity:1;font-size:10px;}
.chip:hover .x{opacity:1;}
.clearall{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#FFF;opacity:1;
  background:none;border:none;cursor:pointer;text-decoration:underline;}
.clearall:hover{opacity:1;}

/* ---------------- RESULT SUMMARY ---------------- */
.summary{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--edge);border-radius:4px;
  background:var(--ink);margin-bottom:14px;}
.sm{padding:15px 18px;border-right:1px solid var(--rule);}
.sm:last-child{border-right:none;}
.sm .k{display:block;margin-bottom:8px;}
.sm .v{font-family:var(--fig);font-weight:600;font-size:17px;letter-spacing:-.05em;color:#FFF;}
.sm:first-child .v{font-size:22px;}
.sm .v.up{color:var(--up-2);} .sm .v.dn{color:var(--dn-2);}

/* ---------------- THE TAPE ---------------- */
.tape{display:flex;flex-direction:column;gap:14px;}
.thead{display:grid;grid-template-columns:62px 46px 58px 132px 1fr 30px 60px 104px 28px;
  gap:0;padding:0;background:var(--panel);border:1px solid var(--edge);border-radius:4px;margin-bottom:14px;}
.thead div{font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;color:#FFF;opacity:1;
  padding:10px 8px;white-space:nowrap;}
.thead div:first-child{padding-left:16px;}
.thead div.n{text-align:right;}
.thead div.last{padding-right:16px;}

/* ---- each session is its own framed block ---- */
.daygroup{border:1px solid var(--edge);border-radius:4px;background:var(--ink);overflow:hidden;}
.daygroup.win{box-shadow:inset 3px 0 0 var(--up);}
.daygroup.lose{box-shadow:inset 3px 0 0 var(--dn);}
.daygroup.flatday{box-shadow:inset 3px 0 0 rgba(255,255,255,.3);}

.dayhead{display:flex;align-items:baseline;gap:14px;padding:14px 18px;background:var(--panel);
  border-bottom:1px solid var(--rule);}
.dayhead .dd{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.02em;color:#FFF;}
.dayhead .dnet{font-family:var(--fig);font-weight:600;font-size:17px;letter-spacing:-.05em;}
.dayhead .dnet.up{color:var(--up-2);}
.dayhead .dnet.dn{color:var(--dn-2);}
.dayhead .dnet.flat{color:#FFF;opacity:1;}
.dayhead .dc{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#FFF;opacity:1;}
.dayhead .cal{margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:#FFF;opacity:1;text-decoration:none;transition:opacity .15s;}
.dayhead:hover .cal{opacity:.72;}
.dayhead .cal:hover{opacity:1;}

/* trade row */
.tr{display:grid;grid-template-columns:62px 46px 58px 132px 1fr 30px 60px 104px 28px;
  align-items:center;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .14s;position:relative;}
.daygroup .tr:last-child{border-bottom:none;}
.daygroup .detail:last-child{border-bottom:none;}
.tr:hover{background:var(--panel);}
.tr.open{background:var(--panel);}
.tr > *{padding:14px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr > *:first-child{padding-left:16px;}
.tr > *.last{padding-right:16px;}
.tr .tm{font-family:var(--mono);font-size:10.5px;color:#FFF;opacity:1;letter-spacing:.06em;}
.tr .sy{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:-.02em;color:#FFF;}
.tr .sd{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;opacity:1;}
.tr .sd.l{color:var(--up-2);} .tr .sd.s{color:var(--dn-2);}
.tag{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 8px;
  border:1px solid var(--rule);color:#FFF;opacity:1;display:inline-block;}
.tr .gr{font-family:var(--disp);font-weight:700;font-size:12px;color:#FFF;text-align:center;}
.tr .rr{font-family:var(--fig);font-size:11.5px;font-weight:500;letter-spacing:-.03em;text-align:right;color:#FFF;opacity:1;}

/* R multiple as light, at one scale in both directions (±3R) */
.thead .rhead{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:#FFF;opacity:1;text-align:center;}
.tr .rcell{padding-top:0;padding-bottom:0;}
.rbar{position:relative;display:block;height:6px;background:rgba(255,255,255,.045);}
.rbar .z{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.22);}
.rbar i{position:absolute;top:0;bottom:0;}
.rbar i.up{background:var(--up);left:50%;}
.rbar i.dn{background:var(--dn);right:50%;}
.rbar i.zero{background:rgba(255,255,255,.35);left:calc(50% - 4px);width:8px;}
.tr .pl{font-family:var(--fig);font-weight:600;font-size:14px;letter-spacing:-.045em;text-align:right;}
.tr .pl.up{color:var(--up-2);} .tr .pl.dn{color:var(--dn-2);} .tr .pl.flat{color:#FFF;opacity:1;}
.tr .exp{font-family:var(--mono);font-size:10px;color:#FFF;opacity:1;text-align:right;transition:transform .18s, opacity .14s;}
.tr:hover .exp{opacity:.9;}
.tr.open .exp{transform:rotate(90deg);opacity:1;}

/* inline detail */
.detail{border-bottom:1px solid var(--rule);background:rgba(255,255,255,.02);display:none;}
.detail.on{display:block;}
/* numbers in one horizontal strip */
.dstrip{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--rule);}
.dstrip .f{padding:14px 16px;border-right:1px solid var(--hair);}
.dstrip .f:last-child{border-right:none;}
.dstrip .f span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#FFF;opacity:1;margin-bottom:7px;}
.dstrip .f b{font-family:var(--fig);font-size:14px;font-weight:500;letter-spacing:-.04em;color:#FFF;}
.dstrip .f b.up{color:var(--up-2);} .dstrip .f b.dn{color:var(--dn-2);}

.dbody{display:grid;grid-template-columns:1fr 340px;}
.dchart{padding:18px;border-right:1px solid var(--rule);}
.shot{min-height:230px;height:100%;border:1px dashed var(--rule);border-radius:3px;display:flex;align-items:center;justify-content:center;}
.dside{padding:18px;}
.dside .lab{display:block;margin-bottom:12px;}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.dmeta .m{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#FFF;
  border:1px solid var(--rule);padding:5px 9px;}
.note{font-size:13.5px;line-height:1.75;color:#FFF;opacity:1;margin-bottom:4px;}
.note.empty{opacity:.4;font-style:italic;}
.dact{display:flex;gap:8px;margin-top:16px;}
.dbtn{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#FFF;
  background:rgba(255,255,255,.06);border:1px solid var(--rule);border-radius:2px;padding:8px 13px;cursor:pointer;transition:all .14s;}
.dbtn:hover{background:rgba(255,255,255,.12);}

/* empty state */
.empty-state{padding:60px 20px;text-align:center;}
.empty-state .h{font-family:var(--disp);font-weight:600;font-size:17px;color:#FFF;margin-bottom:9px;}
.empty-state p{font-size:13px;color:#FFF;opacity:1;}

.foot{display:flex;justify-content:space-between;margin-top:34px;font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:#FFF;opacity:1;}

@media(max-width:1200px){
  .nav{display:none;}
  .thead{display:none;}
  .tr{grid-template-columns:56px 44px 1fr 100px 28px;}
  .tr .sd,.tr .gr,.tr .rr,.tr .rcell{display:none;}
  .thead .rhead{display:none;}
  .summary{grid-template-columns:repeat(2,1fr);}
  .sm{border-bottom:1px solid var(--rule);}
  .dstrip{grid-template-columns:repeat(4,1fr);}
  .dstrip .f{border-bottom:1px solid var(--hair);}
  .dbody{grid-template-columns:1fr;}
  .dchart{border-right:none;border-bottom:1px solid var(--rule);}
  .panel-drawer{grid-template-columns:1fr;}
}

/* ---- branded plate behind the masthead, same image family as Community ---- */
.plateband{position:absolute;left:0;right:0;top:0;height:210px;z-index:-1;pointer-events:none;overflow:hidden;}
.plateband .im{position:absolute;inset:0;background:url("https://d8j0ntlcm91z4.cloudfront.net/user_3DdB73ts10b7cJDBWSq817QLgQw/hf_20260724_233044_de760f1e-15bb-4a9b-8a69-65b184dc37c8.png") center 45%/cover no-repeat;
  filter:grayscale(1) contrast(1.25) brightness(.42);opacity:.5;}
.plateband .fade{position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(14,17,20,.45) 0%, rgba(14,17,20,.78) 55%, var(--black) 100%);}
.wrap{position:relative;}
</style>
</head>
<body>

<div class="flute"></div>
<div class="vign"></div>

<header class="top">
  <div class="in">
    <div class="brand"><span class="gh">Rewind</span>Rewind<em>No. 001</em></div>
    <nav class="nav">
      <a class="nl" href="rewind-calendar.html">Calendar</a>
      <a class="nl" href="rewind-overview.html">Overview</a>
      <a class="nl on" href="rewind-history.html">History</a>
      <a class="nl" href="rewind-community.html">Community</a><a class="nl" href="rewind-showroom.html">Showroom</a>
      <a class="nl">Settings</a>
    </nav>
    <div class="tools">
      <span class="tstamp">NY · 16:42 · Closed</span>
      <button class="btn-w">Log trade</button>
      <span class="avatar"></span>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="plateband"><div class="im"></div><div class="fade"></div></div>


  <div class="mast">
    <div class="mtitle">
      <span class="g3">History</span><span class="g2">History</span><span class="g1">History</span><span>History</span>
    </div>
    <div class="mastr">The tape · newest first</div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="crow">
      <label class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" placeholder="Search symbol, model, note…" autocomplete="off">
      </label>
      <button class="filterbtn" id="filterbtn" aria-expanded="false">
        Filters<span class="badge" id="fcount"></span>
      </button>
      <select id="sort" aria-label="Sort">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
        <option value="pnl_desc">Best P&amp;L</option>
        <option value="pnl_asc">Worst P&amp;L</option>
        <option value="r_desc">Highest R</option>
        <option value="r_asc">Lowest R</option>
        <option value="hold_desc">Longest hold</option>
        <option value="hold_asc">Shortest hold</option>
      </select>
    </div>

    <div class="panel-drawer" id="drawer">
      <div class="dfield">
        <span class="lab">Outcome</span>
        <div class="seg" id="outcome">
          <button class="on" data-o="all">All</button>
          <button data-o="win">Wins</button>
          <button data-o="loss">Losses</button>
          <button data-o="be">Break even</button>
        </div>
      </div>
      <div class="dfield"><span class="lab">Account</span><select id="fAccount"><option value="">Any</option></select></div>
      <div class="dfield"><span class="lab">Model</span><select id="fModel"><option value="">Any</option></select></div>
      <div class="dfield"><span class="lab">Session</span><select id="fSession"><option value="">Any</option></select></div>
      <div class="dfield"><span class="lab">Symbol</span><select id="fSymbol"><option value="">Any</option></select></div>
    </div>

    <div class="chips" id="chips"></div>
  </div>

  <!-- filtered totals -->
  <div class="summary" id="summary"></div>

  <!-- the tape -->
  <div class="thead">
    <div>Time</div><div>Sym</div><div>Side</div><div>Model</div>
    <div class="rhead">−3R &nbsp;·&nbsp; 0 &nbsp;·&nbsp; +3R</div>
    <div>Gr</div><div class="n">R</div><div class="n">P&amp;L</div><div class="n last"></div>
  </div>
  <div class="tape" id="rows"></div>

  <div class="foot"><span>Rewind · Members' ledger</span><span>Log · Review · Repeat</span></div>
</div>

<script>
/* ============================================================
   THE TAPE — one entry per trade.
   Day subtotals here must equal the calendar's day cells.
   ============================================================ */
const T=[
  /* Jul 22 · +$1,085 */

const CAL_DAY_NET={'2026-07-13':-680,'2026-07-14':310,'2026-07-15':925,'2026-07-16':0,
                   '2026-07-17':460,'2026-07-20':740,'2026-07-21':-180,'2026-07-22':1085};

/* ---------- helpers ---------- */
const R_SCALE=3;                 /* ±3R spans the bar; same px per R either way */
const rbar=r=>{
  if(r===0) return `<span class="rbar"><i class="z"></i><i class="zero"></i></span>`;
  const w=Math.min(Math.abs(r)/R_SCALE,1)*50;
  return `<span class="rbar"><i class="z"></i><i class="${r>0?'up':'dn'}" style="width:${w}%"></i></span>`;
};
const money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString();
const signed=n=>n===0?'$0':(n<0?'−$':'+$')+Math.abs(Math.round(n)).toLocaleString();
const cls=n=>n>0?'up':n<0?'dn':'flat';
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);
  return {dow:DOW[dt.getDay()], nice:`${d} ${MON[m-1]} ${y}`};}

/* ---------- filters from the URL ---------- */
const U=new URLSearchParams(location.search);
const F={
  q:'', outcome:'all',
  acct:U.get('account')||'', model:U.get('model')||'', sess:U.get('session')||'', sym:U.get('symbol')||'',
  date:U.get('date')||'', from:U.get('from')||'', to:U.get('to')||'', month:U.get('month')||'',
  sort:U.get('sort')||'date_desc'
};

/* populate selects from the data itself */
function fill(id,key){
  const el=document.getElementById(id);
  [...new Set(T.map(t=>t[key]))].sort().forEach(v=>{
    const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);
  });
}
fill('fAccount','acct'); fill('fModel','model'); fill('fSession','sess'); fill('fSymbol','sym');
document.getElementById('fAccount').value=F.acct;
document.getElementById('fModel').value=F.model;
document.getElementById('fSession').value=F.sess;
document.getElementById('fSymbol').value=F.sym;
document.getElementById('sort').value=F.sort;

/* ---------- apply ---------- */
function inScope(t){
  if(F.date  && t.d!==F.date) return false;
  if(F.month && !t.d.startsWith(F.month)) return false;
  if(F.from  && t.d<F.from) return false;
  if(F.to    && t.d>F.to) return false;
  return true;
}
function apply(){
  let out=T.filter(t=>{
    if(!inScope(t)) return false;
    if(F.acct  && t.acct!==F.acct) return false;
    if(F.model && t.model!==F.model) return false;
    if(F.sess  && t.sess!==F.sess) return false;
    if(F.sym   && t.sym!==F.sym) return false;
    if(F.outcome==='win'  && !(t.pnl>0)) return false;
    if(F.outcome==='loss' && !(t.pnl<0)) return false;
    if(F.outcome==='be'   && t.pnl!==0) return false;
    if(F.q){
      const hay=`${t.sym} ${t.side} ${t.model} ${t.acct} ${t.sess} ${t.note} ${t.id}`.toLowerCase();
      if(!hay.includes(F.q.toLowerCase())) return false;
    }
    return true;
  });
  const S={
    date_desc:(a,b)=>(b.d+b.t).localeCompare(a.d+a.t), date_asc:(a,b)=>(a.d+a.t).localeCompare(b.d+b.t),
    pnl_desc:(a,b)=>b.pnl-a.pnl, pnl_asc:(a,b)=>a.pnl-b.pnl,
    r_desc:(a,b)=>b.r-a.r, r_asc:(a,b)=>a.r-b.r,
    hold_desc:(a,b)=>b.hold-a.hold, hold_asc:(a,b)=>a.hold-b.hold
  };
  return out.sort(S[F.sort]||S.date_desc);
}

/* ---------- summary of the filtered set ---------- */
function renderSummary(set){
  const net=set.reduce((s,t)=>s+t.pnl,0);
  const wins=set.filter(t=>t.pnl>0), losses=set.filter(t=>t.pnl<0), bes=set.filter(t=>t.pnl===0);
  const gp=wins.reduce((s,t)=>s+t.pnl,0), gl=-losses.reduce((s,t)=>s+t.pnl,0);
  const decided=wins.length+losses.length;
  const days=new Set(set.map(t=>t.d)).size;
  document.getElementById('summary').innerHTML=`
    <div class="sm"><span class="lab k">Net of selection</span><span class="v ${cls(net)}">${signed(net)}</span></div>
    <div class="sm"><span class="lab k">Trades</span><span class="v">${set.length}<span style="font-size:11px;"> / ${T.length}</span></span></div>
    <div class="sm"><span class="lab k">Win rate</span><span class="v">${decided?Math.round(wins.length/decided*100)+'%':'—'}</span></div>
    <div class="sm"><span class="lab k">Profit factor</span><span class="v">${gl?(gp/gl).toFixed(2):'—'}</span></div>
    <div class="sm"><span class="lab k">Outcomes</span><span class="v">${wins.length}<span style="font-size:11px;">W</span> ${losses.length}<span style="font-size:11px;">L</span> ${bes.length}<span style="font-size:11px;">BE</span></span></div>`;
  document.getElementById('fcount').className = 'badge' + (activeCount()?' on':'');
  document.getElementById('fcount').textContent = activeCount()||'';
}

/* ---------- active filter chips ---------- */
const CHIP_LABEL={date:'Date',from:'From',to:'To',month:'Month',acct:'Account',model:'Model',sess:'Session',sym:'Symbol',outcome:'Outcome',q:'Search'};
function renderChips(){
  const active=Object.entries(F).filter(([k,v])=>v && k!=='sort' && !(k==='outcome'&&v==='all'));
  const box=document.getElementById('chips');
  if(!active.length){box.innerHTML='';return;}
  box.innerHTML=`<span class="from">Filtered by</span>`+
    active.map(([k,v])=>`<button class="chip" data-k="${k}"><b>${CHIP_LABEL[k]}</b> ${v} <span class="x">✕</span></button>`).join('')+
    `<button class="clearall" id="clearall">Clear all</button>`;
  box.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const k=c.dataset.k; F[k]= k==='outcome' ? 'all' : '';
    if(k==='q') document.getElementById('q').value='';
    if(k==='acct') document.getElementById('fAccount').value='';
    if(k==='model') document.getElementById('fModel').value='';
    if(k==='sess') document.getElementById('fSession').value='';
    if(k==='sym') document.getElementById('fSymbol').value='';
    if(k==='outcome') syncOutcome();
    render();
  }));
  const ca=document.getElementById('clearall');
  if(ca) ca.addEventListener('click',()=>{
    Object.keys(F).forEach(k=>{ if(k==='sort')return; F[k]= k==='outcome'?'all':''; });
    ['q'].forEach(i=>document.getElementById(i).value='');
    ['fAccount','fModel','fSession','fSymbol'].forEach(i=>document.getElementById(i).value='');
    syncOutcome(); render();
  });
}
function syncOutcome(){
  document.querySelectorAll('#outcome button').forEach(b=>b.classList.toggle('on', b.dataset.o===F.outcome));
}

/* ---------- the tape ---------- */
let OPEN=null;
function renderRows(set){
  const box=document.getElementById('rows');
  if(!set.length){
    box.innerHTML=`<div class="daygroup"><div class="empty-state"><div class="h">Nothing on the tape for this selection</div>
      <p>Loosen a filter, or clear them all to see every logged trade.</p></div></div>`;
    return;
  }
  const grouped = F.sort.startsWith('date');

  /* one row of markup for a single trade + its detail panel */
  const rowHTML=(t)=>`
    <div class="tr ${OPEN===t.id?'open':''}" data-id="${t.id}" tabindex="0" role="button" aria-expanded="${OPEN===t.id}">
      <span class="tm num">${t.t}</span>
      <span class="sy">${t.sym}</span>
      <span class="sd ${t.side==='Long'?'l':'s'}">${t.side}</span>
      <span class="tagcell"><span class="tag">${t.model}</span></span>
      <span class="rcell">${rbar(t.r)}</span>
      <span class="gr">${t.grade}</span>
      <span class="rr num">${t.r>0?'+':t.r<0?'−':''}${Math.abs(t.r).toFixed(2)}</span>
      <span class="pl num ${cls(t.pnl)}">${signed(t.pnl)}</span>
      <span class="exp last">›</span>
    </div>
    <div class="detail ${OPEN===t.id?'on':''}" data-for="${t.id}">
      <div class="dstrip">
        <div class="f"><span>Entry</span><b class="num">${t.entry.toLocaleString()}</b></div>
        <div class="f"><span>Exit</span><b class="num">${t.exit.toLocaleString()}</b></div>
        <div class="f"><span>Stop</span><b class="num">${t.stop.toLocaleString()}</b></div>
        <div class="f"><span>Points</span><b class="num">${(t.side==='Long'?t.exit-t.entry:t.entry-t.exit).toLocaleString()}</b></div>
        <div class="f"><span>Contracts</span><b class="num">${t.size}</b></div>
        <div class="f"><span>Hold</span><b class="num">${t.hold}m</b></div>
        <div class="f"><span>R</span><b class="num ${cls(t.r)}">${t.r>0?'+':t.r<0?'−':''}${Math.abs(t.r).toFixed(2)}R</b></div>
        <div class="f"><span>Net</span><b class="num ${cls(t.pnl)}">${signed(t.pnl)}</b></div>
      </div>
      <div class="dbody">
        <div class="dchart">
          <div class="shot">
            <svg width="160" height="66" viewBox="0 0 160 66"><g stroke-width="5" stroke-linecap="round">
              <line x1="10" y1="56" x2="10" y2="38" stroke="#57BE8B"/><line x1="30" y1="51" x2="30" y2="28" stroke="#57BE8B"/>
              <line x1="50" y1="43" x2="50" y2="54" stroke="#DE6B62"/><line x1="70" y1="46" x2="70" y2="23" stroke="#57BE8B"/>
              <line x1="90" y1="36" x2="90" y2="15" stroke="#57BE8B"/><line x1="110" y1="31" x2="110" y2="41" stroke="#DE6B62"/>
              <line x1="130" y1="28" x2="130" y2="10" stroke="#57BE8B"/><line x1="150" y1="20" x2="150" y2="8" stroke="#57BE8B"/>
            </g></svg>
          </div>
        </div>
        <div class="dside">
          <span class="lab">Context</span>
          <div class="dmeta">
            <span class="m">${t.acct}</span><span class="m">${t.sess}</span>
            <span class="m">Grade ${t.grade}</span><span class="m">${t.id}</span>
          </div>
          <div class="dmeta">${t.conf.map(([tf,c])=>`<span class="m">${tf} · ${c}</span>`).join('')}</div>
          <p class="note ${t.note?'':'empty'}">${t.note||'No note written for this trade.'}</p>
          <div class="dact">
            <button class="dbtn">Edit</button>
            <button class="dbtn">Add note</button>
            <button class="dbtn">Share card</button>
          </div>
        </div>
      </div>
    </div>`;

  let html='';

  if(!grouped){
    /* sorted by P&L or R — no sessions to group by, one continuous block */
    html=`<div class="daygroup">${set.map(t=>rowHTML(t)).join('')}</div>`;
  }else{
    /* one framed block per session, newest first */
    const days=[...new Set(set.map(t=>t.d))];
    html=days.map(d=>{
      const dayTrades=set.filter(x=>x.d===d);
      const shown=dayTrades.reduce((s,x)=>s+x.pnl,0);
      const full=T.filter(x=>x.d===d).reduce((s,x)=>s+x.pnl,0);
      const allCount=T.filter(x=>x.d===d).length;
      const partial=dayTrades.length!==allCount;
      const cal=CAL_DAY_NET[d];
      const agrees = cal===undefined || full===cal;
      const {dow,nice}=fmtDate(d);
      const tone = full>0?'win':full<0?'lose':'flatday';
      const n=dayTrades.length;
      return `<div class="daygroup ${tone}">
        <div class="dayhead">
          <span class="dd">${dow} ${nice}</span>
          <span class="dnet ${cls(shown)}">${signed(shown)}</span>

                                     :`${n} ${n===1?'trade':'trades'}`}</span>

    }).join('');
  }

  box.innerHTML=html;

  box.querySelectorAll('.tr').forEach(r=>{
    const toggle=()=>{

    };
    r.addEventListener('click',toggle);

  });
}

function render(refocus){
  const set=apply();
  renderChips(); renderSummary(set); renderRows(set);
  document.querySelector('.thead').style.display = set.length ? 'grid' : 'none';
  if(refocus){const el=document.querySelector(`.tr[data-id="${refocus}"]`); if(el) el.focus();}
}

}
